# Mirrored in intelli-verse-kube-infra/toba-prod/cattr/buildspec.yml
#
# BUILD_STRATEGY (CodeBuild env, default dockerfile):
#   dockerfile  — full `docker build -f Dockerfile` (needs Amazingcat GitLab registry login).
#   hub-retag   — pull public Hub image, retag to ECR. No repo PHP in the image.
#   hub-overlay — pull public Hub image, then `docker build -f Dockerfile.hub-overlay`:
#                 official runtime + your repo `app/` + `routes/` copied in (no Amazingcat login).
#
# hub-retag / hub-overlay optional env:
#   PUBLIC_CATTR_IMAGE  default docker.io/amazingcat/cattr:3.4.3
#
# CodeBuild: privileged Docker ON.
version: 0.2
run-as: root

phases:
  pre_build:
    commands:
      - echo "=== Cattr CodeBuild pre_build ==="
      - export AWS_REGION="${AWS_REGION:-us-east-1}"
      - export AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-970547373533}"
      - export EKS_CLUSTER_NAME="${EKS_CLUSTER_NAME:-ai-cart-auto-cluster}"
      - export K8S_NAMESPACE="${K8S_NAMESPACE:-toba-prod}"
      - export BUILD_STRATEGY="${BUILD_STRATEGY:-dockerfile}"
      - export REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cattr-server"
      - export COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
      - if [ -z "$COMMIT_HASH" ]; then export COMMIT_HASH="nogit"; fi
      - export IMAGE_TAG="${COMMIT_HASH}-b${CODEBUILD_BUILD_NUMBER}"
      - echo "IMAGE_TAG=$IMAGE_TAG BUILD_STRATEGY=$BUILD_STRATEGY"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - |
        if ! aws ecr describe-repositories --repository-names cattr-server --region "$AWS_REGION" 2>/dev/null; then
          aws ecr create-repository --repository-name cattr-server --region "$AWS_REGION" --image-scanning-configuration scanOnPush=true || true
        fi
      - |
        if [ "$BUILD_STRATEGY" = "hub-retag" ] || [ "$BUILD_STRATEGY" = "hub-overlay" ]; then
          echo "$BUILD_STRATEGY: skip registry.git.amazingcat.net (public Hub image only)"
        else
          if [ -z "$AMAZINGCAT_REGISTRY_USER" ]; then
            export AMAZINGCAT_REGISTRY_USER=$(aws ssm get-parameter --name "/codebuild/cattr-server/AMAZINGCAT_REGISTRY_USER" --with-decryption --region "$AWS_REGION" --query "Parameter.Value" --output text 2>/dev/null || true)
          fi
          if [ -z "$AMAZINGCAT_REGISTRY_PASSWORD" ]; then
            export AMAZINGCAT_REGISTRY_PASSWORD=$(aws ssm get-parameter --name "/codebuild/cattr-server/AMAZINGCAT_REGISTRY_PASSWORD" --with-decryption --region "$AWS_REGION" --query "Parameter.Value" --output text 2>/dev/null || true)
          fi
          if [ -z "$AMAZINGCAT_REGISTRY_USER" ] || [ -z "$AMAZINGCAT_REGISTRY_PASSWORD" ]; then
            echo "Missing Amazingcat credentials for dockerfile build."
            echo "Set BUILD_STRATEGY=hub-retag or hub-overlay on CodeBuild, or set SSM / env AMAZINGCAT_REGISTRY_*"
            exit 1
          fi
          echo "$AMAZINGCAT_REGISTRY_PASSWORD" | docker login registry.git.amazingcat.net -u "$AMAZINGCAT_REGISTRY_USER" --password-stdin
        fi

  build:
    commands:
      - export AWS_REGION="${AWS_REGION:-us-east-1}"
      - export AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-970547373533}"
      - export BUILD_STRATEGY="${BUILD_STRATEGY:-dockerfile}"
      - export REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cattr-server"
      - export COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
      - if [ -z "$COMMIT_HASH" ]; then export COMMIT_HASH="nogit"; fi
      - export IMAGE_TAG="${COMMIT_HASH}-b${CODEBUILD_BUILD_NUMBER}"
      - |
        export PUBLIC_CATTR_IMAGE="${PUBLIC_CATTR_IMAGE:-docker.io/amazingcat/cattr:3.4.3}"
        if [ "$BUILD_STRATEGY" = "hub-retag" ]; then
          echo "=== hub-retag: pull $PUBLIC_CATTR_IMAGE → $REPOSITORY_URI:$IMAGE_TAG ==="
          docker pull "$PUBLIC_CATTR_IMAGE"
          docker tag "$PUBLIC_CATTR_IMAGE" "$REPOSITORY_URI:$IMAGE_TAG"
          docker tag "$PUBLIC_CATTR_IMAGE" "$REPOSITORY_URI:latest"
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:latest"
        elif [ "$BUILD_STRATEGY" = "hub-overlay" ]; then
          echo "=== hub-overlay: pull $PUBLIC_CATTR_IMAGE then overlay repo app/ + routes/ ==="
          docker pull "$PUBLIC_CATTR_IMAGE"
          export DOCKER_BUILDKIT=1
          docker build \
            -f Dockerfile.hub-overlay \
            --build-arg "PUBLIC_CATTR_IMAGE=$PUBLIC_CATTR_IMAGE" \
            -t "$REPOSITORY_URI:latest" \
            -t "$REPOSITORY_URI:$IMAGE_TAG" \
            .
          docker push "$REPOSITORY_URI:latest"
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
        else
          echo "=== docker build (Dockerfile, Amazingcat base) ==="
          export DOCKER_BUILDKIT=1
          docker build -t "$REPOSITORY_URI:latest" -t "$REPOSITORY_URI:$IMAGE_TAG" .
          docker push "$REPOSITORY_URI:latest"
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
        fi

  post_build:
    commands:
      - echo "=== EKS deploy ==="
      - export AWS_REGION="${AWS_REGION:-us-east-1}"
      - export AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-970547373533}"
      - export EKS_CLUSTER_NAME="${EKS_CLUSTER_NAME:-ai-cart-auto-cluster}"
      - export K8S_NAMESPACE="${K8S_NAMESPACE:-toba-prod}"
      - export REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cattr-server"
      - export COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
      - if [ -z "$COMMIT_HASH" ]; then export COMMIT_HASH="nogit"; fi
      - export IMAGE_TAG="${COMMIT_HASH}-b${CODEBUILD_BUILD_NUMBER}"
      - export IMG="${REPOSITORY_URI}:${IMAGE_TAG}"
      - command -v kubectl >/dev/null 2>&1 || (curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl)
      - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --kubeconfig /root/.kube/config
      - export KUBECONFIG=/root/.kube/config
      - echo "Rolling deployment/cattr-server to $IMG ..."
      - kubectl set image deployment/cattr-server cattr="$IMG" bootstrap-mysql-and-perms="$IMG" -n "$K8S_NAMESPACE"
      - kubectl rollout status deployment/cattr-server -n "$K8S_NAMESPACE" --timeout=15m
