# CodeBuild -> GitHub Actions migration (2026-07-08).
# Replaces: CodePipeline cattr-server-pipeline + CodeBuild cattr-server-build.
# Executes the repo's buildspec.yml unchanged via gha-ci's run_buildspec.py.
# Rollback: re-point cattr-server-pipeline's trigger branch filter back to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE: arn:aws:iam::803881282303:role/github-actions-cattr-server-deploy
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: "803881282303"
  EKS_CLUSTER_NAME: ai-cart-auto-cluster
  # Mirrors the old CodeBuild project env: retag the public Hub image, no
  # Amazingcat GitLab registry login needed.
  BUILD_STRATEGY: hub-retag
  PUBLIC_CATTR_IMAGE: docker.io/amazingcat/cattr:3.4.3

jobs:
  build-deploy:
    permissions:
      id-token: write
      contents: read
    uses: intelli-verse-x/gha-ci/.github/workflows/build-deploy.yml@main
    with:
      aws_role_arn: arn:aws:iam::803881282303:role/github-actions-cattr-server-deploy
      runs_on: ubuntu-24.04
      timeout_minutes: 60
      build_strategy: hub-retag
      public_image: docker.io/amazingcat/cattr:3.4.3
    secrets: inherit

  # ── Post-deploy smoke test (added 2026-07-10) ─────────────────────────────
  # Verifies the rollout actually converged and the service answers before the
  # run is called green. On failure: automatic `kubectl rollout undo` and the
  # workflow fails, which fires the Discord deploy-alert (red card) and the CI
  # Failure Sentinel.
  smoke-test:
    needs: build-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: ai-cart-auto-cluster
      SMOKE_NAMESPACE: toba-prod
      SMOKE_DEPLOYMENTS: "cattr-server"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: Assert target AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT_ID" != "803881282303" ]; then
            echo "::error::Expected AWS account 803881282303, got $ACCOUNT_ID"
            exit 1
          fi

      - name: Connect to EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Rollout + pod health check
        run: |
          set -euo pipefail
          for D in $SMOKE_DEPLOYMENTS; do
            echo "=== rollout status: $D ==="
            kubectl rollout status "deployment/$D" -n "$SMOKE_NAMESPACE" --timeout=6m
            echo "=== crashloop check: $D ==="
            BAD=$(kubectl get pods -n "$SMOKE_NAMESPACE" -l "app=$D" \
              -o jsonpath='{range .items[*]}{.metadata.name} {range .status.containerStatuses[*]}{.state.waiting.reason} {end}{"\n"}{end}' \
              | grep -E 'CrashLoopBackOff|ImagePullBackOff|ErrImagePull' || true)
            if [ -n "$BAD" ]; then
              echo "Unhealthy pods detected:"; echo "$BAD"; exit 1
            fi
          done

      - name: Auto-rollback on smoke failure
        if: failure()
        run: |
          for D in $SMOKE_DEPLOYMENTS; do
            echo "=== rolling back: $D ==="
            kubectl rollout undo "deployment/$D" -n "$SMOKE_NAMESPACE" || true
            kubectl rollout status "deployment/$D" -n "$SMOKE_NAMESPACE" --timeout=6m || true
          done
          echo "Rolled back. Investigate the failed deploy before re-merging."
