# No build here — only notifies intelli-verse-kube-infra (see cattr-server-build.yml).
name: Notify kube-infra (deploy)

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build & Deploy Cattr server in intelli-verse-kube-infra
        env:
          TOKEN: ${{ secrets.KUBE_INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add secret KUBE_INFRA_DISPATCH_TOKEN (PAT with repo scope, able to POST dispatches to intelli-verse-x/intelli-verse-kube-infra)."
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/intelli-verse-x/intelli-verse-kube-infra/dispatches \
            -d "{\"event_type\":\"cattr-server-build\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}"
